spec_version: 1
name: gpt
description: >-
  Plain GPT brainstorming responder — answers a question on its own merits,
  and (during a debate) critiques the other partner's answer.

# Plain responder on the native Antigravity harness, running a GPT-family model
# through the user's signed-in `agy` CLI session. It has filesystem access (see
# the ``os_env`` block below) so it can read reference files while reasoning.
#
# Why antigravity-native rather than codex or openai-agents. All three can serve
# a GPT head; only this one runs on credentials this host actually has.
#   - `codex` needs the `codex` CLI on the daemon's PATH plus an OpenAI login.
#     Neither is a given here: the only codex binaries on the box are an npm
#     shim under omnigent-fork/node_modules and one vendored inside the VS Code
#     ChatGPT extension, so a dispatch dies with "CodexExecutor requires the
#     'codex' CLI on PATH".
#   - `openai-agents` treats an unpinned model as a Databricks model (see
#     omnigent/inner/openai_agents_sdk_executor.py — `is_databricks_model =
#     model is None`) and, with no OPENAI_API_KEY/OPENAI_BASE_URL set, silently
#     falls back to ambient Databricks credentials — routing Debby's "GPT" head
#     through the Databricks gateway instead of OpenAI.
#   - `antigravity-native` drives the signed-in `agy` binary, so it needs no API
#     key at all. `agy models` lists `gpt-oss-120b-medium` alongside the Gemini
#     and Claude rows, and model_catalog.py maps the antigravity harness to
#     OPENAI_FAMILY — so a GPT head here is the harness's own family, not a
#     substitution.
#
# No model is pinned: the head runs whatever the session's config dialog picked
# for it (`sub_model_override`), falling back to agy's default. Pinning one here
# would silently outrank a human's pick in the picker, which is the wrong way
# round.
#
# Note `harness: antigravity` (the SDK) is a different thing: it wants an
# ANTIGRAVITY_API_KEY / GEMINI_API_KEY. `antigravity-native` is the CLI-session
# path, which is what is authenticated on this host.
executor:
  type: omnigent
  config:
    harness: antigravity-native

# Declaring ``os_env`` registers the ``sys_os_read`` / ``sys_os_write`` /
# ``sys_os_edit`` / ``sys_os_shell`` tools (filesystem access comes bundled with
# a shell). ``sandbox: type: none`` runs unsandboxed in the caller's working
# directory.
os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: none

# Same blast-radius guardrail Polly's sub-agents use, so the shell behaves
# identically: the catastrophic set (force-push, ``rm -rf /``, hard-reset to a
# remote ref) is denied outright, while everything else runs without an ASK
# (``gate_pushes: false``) — a headless head can't answer an approval prompt
# anyway.
guardrails:
  policies:
    blast_radius:
      type: function
      on: [tool_call]
      function:
        path: omnigent.inner.nessie.policies.blast_radius
        arguments:
          gate_pushes: false

prompt: |
  You are the GPT half of Debby, a brainstorming partner. You are a
  thinking-and-writing responder with filesystem access: use your `sys_os_*`
  tools to read any files you need as reference. Don't create or write files
  unless the user explicitly asks — your answer is the deliverable, not notes on
  disk. Your substance is still your own reasoning.

  You are dispatched in one of two modes; the message you receive makes which
  one clear:

  - ANSWER — you are given a question. Answer it directly and well: give your
    genuine, well-reasoned take. Be concrete and specific. Where it helps,
    offer options with trade-offs rather than a single flat answer.

  - CRITIQUE (debate) — you are given your own previous answer (or the
    question) plus the OTHER partner's answer. Engage with the other answer
    honestly: name what it gets right, where it is weak, wrong, or
    incomplete, and what you would change. Then give your own updated answer
    incorporating anything the critique convinced you of. Do not cave just to
    agree, and do not dig in out of pride — converge toward what is actually
    correct.

  Always return a clear, self-contained response. You are one of two voices
  the user will see side by side, so make your reasoning legible on its own.

spec_version: 1
name: hermes
description: Hermes Agent coding sub-agent on NVIDIA NIM — implements, reviews, or explores a scoped task.

# Native Hermes Agent TUI. The model and provider come from Hermes' own
# ~/.hermes/config.yaml (NVIDIA NIM's free tier, capped at 40 requests per
# minute), which the bridge copies into the worker.
executor:
  type: omnigent
  config:
    harness: hermes-native
    # Headless: nobody answers Hermes' dangerous-command panel, so launch with
    # --yolo. The blast_radius policy below still denies the catastrophic set.
    yolo: true

# Hermes does not receive this prompt (its harness delivers no instructions),
# so the nexus dispatch text has to carry the rules itself.
prompt: |
  You are Hermes, a coding sub-agent dispatched by the nexus orchestrator for
  a single scoped task. Your task prompt names its purpose — IMPLEMENT, REVIEW,
  or EXPLORE. Do exactly that one thing. Never ask the human; put open
  questions at the end of your report.

os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: none

guardrails:
  policies:
    blast_radius:
      type: function
      on: [tool_call]
      function:
        path: omnigent.inner.nessie.policies.blast_radius
        arguments:
          gate_pushes: false
